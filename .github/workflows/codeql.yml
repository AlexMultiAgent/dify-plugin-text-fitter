# CodeQL analysis.
#
# Free for public repositories on GitHub.com -- no GitHub Advanced Security
# license required. Results are uploaded to the repository's code scanning
# tab, where they show up as "CodeQL" alerts alongside any other scanner.
#
# The plugin itself is stdlib-only, so the Python queries are the whole
# surface; there is no second language to matrix over.

name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, off-peak minute so this does not pile onto the same cron slot
    # as every other repository's scheduled workflows.
    - cron: "19 4 * * 1"
  workflow_dispatch:
    # Lets a single analysis be re-run on demand, e.g. for a commit that
    # predates this workflow. See codeql-backfill.yml.

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level permissions replace the workflow-level block instead of
    # extending it, so the read permissions are repeated here. Only
    # `security-events` is escalated: the analyze step uploads SARIF to the
    # code scanning tab.
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
