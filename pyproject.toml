[project]
name = "text-fitter"
version = "0.0.2"
description = "Dify plugin for smart text trimming to fit context windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dify-plugin==0.11.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0,<1.0.0",
    "pip-audit>=2.10.0,<3.0.0",
]
# Fuzzing harness only. Atheris ships Linux-only wheels (it bundles
# libFuzzer), so it lives in its own group: `uv sync --group dev` must keep
# working on Windows and macOS.
fuzz = [
    "atheris>=3.1.0,<4.0.0",
]
