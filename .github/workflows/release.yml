# Publishes a GitHub Release for a tagged version.
#
# The package is built from a clean checkout of the tag, so the artifact is
# reproducible from the tagged source: the working tree is what `dify plugin
# package` reads, and a working tree with CRLF endings or a leftover scratch
# file would ship those instead. The verification step compares the package
# against the tag, file by file, and fails the release on any difference.
#
# The asset is attested, so a user can verify that the .difypkg they
# downloaded was built from this repository at this tag:
#
#   gh attestation verify text_fitter-0.0.3.difypkg \
#     --repo AlexMultiAgent/dify-plugin-text-fitter
#
# The marketplace submission to langgenius/dify-plugins stays a manual step.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.0.3"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-level permissions replace the workflow-level block instead of
    # extending it, so `contents: read` is repeated here. `contents: write`
    # creates the release, `id-token: write` mints the OIDC token that the
    # Sigstore signing certificate is issued against, and `attestations` plus
    # `artifact-metadata` store the provenance attestation.
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      # The tag the release is cut from. A tag push carries it in
      # github.ref_name; a manual run carries it in the workflow input.
      # GITHUB_REF_NAME cannot be used for the second case: a manual run is
      # dispatched from a branch, so it would name the branch, not the tag.
      TAG: ${{ inputs.tag || github.ref_name }}
      # The Dify plugin CLI is a Go binary published with the plugin daemon.
      # Both the version and its checksum are pinned: the checksum is what
      # makes the download verifiable.
      CLI_VERSION: "0.6.15"
      CLI_SHA256: "d0a1e3b25bd6c5f6cd749cad2cf04817ea808344e6cc07a2c49bb0108019ab93"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install the Dify plugin CLI
        run: |
          url="https://github.com/langgenius/dify-plugin-daemon/releases/download/${CLI_VERSION}/dify-plugin-linux-amd64"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/dify" "$url"
          echo "${CLI_SHA256}  $RUNNER_TEMP/dify" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/dify"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Run the unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Run Ruff
        run: |
          uv run ruff check main.py provider tools tests
          uv run ruff format --check main.py provider tools tests

      - name: Check that the tag and the manifest agree
        run: |
          tag="${TAG}"
          version="$(grep -E '^version:' manifest.yaml | head -1 | sed -E 's/^version:[[:space:]]*//; s/["'\'']//g')"
          echo "tag: $tag   manifest version: $version"
          if [ "v${version}" != "$tag" ]; then
            echo "the tag does not match the version in manifest.yaml" >&2
            exit 1
          fi

      - name: Package the plugin
        run: |
          plugin="$(grep -E '^name:' manifest.yaml | head -1 | sed -E 's/^name:[[:space:]]*//; s/["'\'']//g')"
          version="$(grep -E '^version:' manifest.yaml | head -1 | sed -E 's/^version:[[:space:]]*//; s/["'\'']//g')"
          asset="dist/${plugin}-${version}.difypkg"
          dify plugin package . -o "$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Verify the package against the tagged source
        run: python scripts/verify_package.py "$ASSET" "${TAG}"

      - name: Attest the package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: ${{ env.ASSET }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256="$(sha256sum "$ASSET" | cut -d' ' -f1)"
          name="$(basename "$ASSET")"
          # A hand-written body wins if the tag carries one; otherwise fall
          # back to the notes generated from the commits. The endpoint only
          # accepts POST and takes tag_name in the body.
          notes="docs/release-notes/${TAG}.md"
          if [ -f "$notes" ]; then
            cp "$notes" "$RUNNER_TEMP/notes.md"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body > "$RUNNER_TEMP/notes.md"
          fi
          {
            echo
            echo
            echo "## SHA256"
            echo
            echo '`'"$name"'` (`sha256:'"$sha256"'`)'
            echo
            echo "## Attestation"
            echo
            echo "Verify that this asset was built from this repository at this tag:"
            echo
            echo '```'
            echo "gh attestation verify $name --repo $GITHUB_REPOSITORY"
            echo '```'
          } >> "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$ASSET" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
